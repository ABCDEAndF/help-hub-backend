spring:
  datasource:
    url: jdbc:mysql://${MYSQL_ADDRESS}/${MYSQL_DATABASE:springboot_demo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  flyway:
    locations: classpath:db/migration

server:
  port: 80

app:
  pickup-code-secret: ${PICKUP_CODE_SECRET}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://servicewechat.com}
  auth:
    jwt-secret: ${JWT_SECRET}
    dev-login-enabled: false

logging:
  level:
    root: INFO
